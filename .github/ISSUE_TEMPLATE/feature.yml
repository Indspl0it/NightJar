name: Feature request
description: Suggest a capability or a change in behaviour
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can't you do today, or what is misleading?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should happen instead? If it touches enforcement, say whether the network acknowledgement may change (it must not).
    validations:
      required: true
  - type: input
    id: build
    attributes:
      label: Build fingerprint (if the request is build-specific)
    validations:
      required: false
