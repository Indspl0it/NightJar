name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # The plain Java modules compile against the android.jar of platform 36 (njStubSdk in gradle.properties).
      - name: Install SDK packages
        run: sdkmanager "platforms;android-36" "platforms;android-37.0" "build-tools;37.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run all quality checks
        run: ./gradlew verify --stacktrace

      - name: Build the debug APK
        run: ./gradlew :app:assembleDebug

      - name: Upload the debug APK
        uses: actions/upload-artifact@v4
        with:
          name: nightjar-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
